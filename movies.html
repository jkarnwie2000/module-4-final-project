<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julius Gold Movies</title>
<link rel="stylesheet" href="styles.css">
<script src="https://kit.fontawesome.com/f23afc0fcf.js" crossorigin="anonymous"></script>
<script src="index.js"></script> 
<script src="movies.js"></script> 
</head>

<body id="movies__body">
   <section>
    <nav>
        <div class="nav__container">
            <img class="logo" src="./assets/moviepagelogo.png" alt="">
            <ul class="nav__links">
                <li><a href="#" class="nav__link">Home</a></li>
                <li><a href="#" class="nav__link">Contact</a></li>
                <li><a href="#" class="nav__link nav__link--primary">Movies</a></li>
            </ul>
            <button class="btn__menu" onclick="openMenu()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="menu__backdrop" style="visibility: hidden;">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()">
                <i class="fas fa-times"></i>
            </button>
            <ul class="menu__links">
                <li class="menu__list">
                    <a href="#" class="menu__link" onclick="closeMenu()">Home</a>
                </li>
                <li class="menu__list">
                    <a href="#features" class="menu__link" onclick="closeMenu()">Movies</a>
                </li>
                <li class="menu__list">
                    <a class="menu__link no-cursor" onclick="closeMenu()">Contact</a>
                </li>
            </ul>
            </div>
        </div>
    </nav>
   </section>

   <main id="movies__main">
    <section>
        <div class="container">
            <div class="row">
                <div class="movies__header">
                <h2 class="section__title movies__header--title">
                    <span class="gold"> Golden </span> <span class="gold"></span> Movie Box
                </h2>
                <select id="filter">
                    <option value="" disabled selected>Sort</option>
                    <option value="LOW_TO_HIGH">Price, Low to High</option>
                    <option value="HIGH_TO_LOW">Price, High to Low</option>
                    <option value="RATING">Rating</option>                    
                </select>
                </div>
                <div class="movies">
                    
                </div>
            </div>
        </div>
    </section>
   </main>
   
   <footer>
    <div class="container">
        <div class="row row__column">
            <a href="#">
                <figure class="footer__logo">
                    <img src="./assets/moviepagelogo.png" class="footer__logo--img" alt="">
                </figure>
                </a>
                <div class="footer__list">
                    <a href="#" class="footer__link">Home</a>
                    <a href="" class="footer__link no-cursor">About</a>
                    <a href="#features" class="footer__link">Movies</a>
                    <a href="" class="footer__link no-cursor">Contact</a>
                </div>
                <div class="footer__copyright">Copyright &copy; 2026 Julius Gold</div>            
        </div>
    </div>
   </footer>
</body>

</html>
